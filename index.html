<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Devoluções - Correios</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Sistema de Controle de Devoluções - Correios</h1>

    <!-- 1. Configuração do Gestor -->
    <div class="secao-bloco">
        <h3>Gestor Imediato</h3>
        <p id="gestor-salvo-info">Carregando gestor...</p>
        <form id="form-gestor">
            <input type="text" id="nome-gestor" placeholder="Nome do Gestor" required>
            <input type="text" id="matricula-gestor" placeholder="Matrícula (0.000.000-0)" required>
            <button type="submit">Salvar Gestor</button>
        </form>
    </div>

    <!-- 2. Cadastrar Novo Carteiro -->
    <div class="secao-bloco">
        <h3>Cadastrar Carteiro</h3>
        <form id="form-carteiro">
            <input type="text" id="nome-carteiro" placeholder="Nome do Carteiro" required>
            <input type="text" id="matricula-carteiro" placeholder="Matrícula (0.000.000-0)" required>
            <button type="submit">Adicionar Carteiro</button>
        </form>
    </div>

    <!-- 3. Cadastrar Novo Motivo (Integrado com IndexedDB) -->
    <div class="cadastro-box">
        <h3>Cadastrar Novo Motivo de Devolução</h3>
        <form id="form-motivo">
            <input type="text" id="nome-motivo" placeholder="Digite o novo motivo aqui..." required>
            <button type="submit">Adicionar à Lista</button>
        </form>
    </div>

    <!-- 4. Registrar Lançamento de Devoluções (Em Tabela) -->
    <div class="secao-bloco">
        <h3>Registrar Lançamentos de Devolução</h3>
        <label><strong>Data dos Lançamentos:</strong></label><br>
        <input type="date" id="data-devolucao" required style="margin-bottom: 15px;"><br>

        <form id="form-devolucao-lote">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr id="cabecalho-lancamento">
                            <!-- Gerado dinamicamente via JS -->
                        </tr>
                    </thead>
                    <tbody id="tabela-lancamento-linhas">
                        <!-- Gerado dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
            <br>
            <button type="submit">Salvar Todos os Lançamentos</button>
        </form>
    </div>

    <!-- 5. Visualização e Relatório para PDF -->
    
    <div id="relatorio-impressao">
        <h2>Relatório Diário de Devoluções</h2>
        <p><b>Data:</b> <span id="relatorio-data-texto">--/--/----</span></p>
        <p><b>Gestor:</b> <span id="pdf-gestor-nome">---</span> (Matrícula: <span id="pdf-gestor-mat">---</span>)</p>
        
        <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th style="padding: 8px; text-align: left;">Motivo da Devolução</th>
                    <th style="padding: 8px; text-align: center;">Quantidade Total</th>
                </tr>
            </thead>
            <tbody id="relatorio-tabela-linhas">
                <!-- Os totais calculados entram aqui automaticamente -->
            </tbody>
        </table>
    </div>

    <!-- Botão de Gerar PDF -->
    <button id="btn-gerar-pdf" type="button" style="margin-top: 20px;">Salvar Relatório em PDF</button>

    <!-- Biblioteca html2pdf para exportação -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
